services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped

    ports:
      - "9000:9000"

    environment:
      VIRTUAL_HOST: portainer.srealmoreno.com
      VIRTUAL_PORT: 9000
      LETSENCRYPT_HOST: portainer.srealmoreno.com
      LETSENCRYPT_EMAIL: admin@srealmoreno.com

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

    networks:
      - proxy

volumes:
  portainer_data:

networks:
  proxy:
    external: true